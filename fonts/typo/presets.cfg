# Wheel typography presets (Settings > Appearance > Typography & Fonts).
#
# Each role is "font candidates | weight | size":
#   - candidates are tried in order; the first one installed is used.
#     Proprietary fonts (Chicago, Geneva, SF Pro, Avenir Next) are never
#     bundled: they are only used if you copy your own licensed files to
#     /.rockbox/fonts/import/. The last candidate is always an open font
#     that ships with the player (SIL OFL), so every preset works.
#   - weight: 100 (thin) ... 900 (black); the nearest available is used
#   - size: XS S M L XL
# spacing: compact | normal | wide        line height: compact | normal | relaxed
# numerals: proportional | tabular        rendering: smooth | sharp | pixel
# menus title / now playing title / lyrics: Auto or a size (per-screen sizes)
#
# You can add your own [section]; it shows up in the gallery.

[classic]
name: Classic iPod
note: Chicago/Geneva if imported, else bitmap fonts
display: Chicago, ChicagoFLF, Classic Bitmap | 700 | M
primary: Chicago, ChicagoFLF, Classic Bitmap | 700 | M
secondary: Geneva, Classic Bitmap | 400 | M
metadata: Geneva, Classic Bitmap | 400 | M
numeric: Chicago, ChicagoFLF, Classic Bitmap | 700 | M
spacing: normal
line height: normal
numerals: tabular
rendering: pixel
menus title: S
now playing title: Auto
lyrics: Auto

